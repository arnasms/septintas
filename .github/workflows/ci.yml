name: Build and check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate projects
        run: xcodegen generate
      - name: Build Mac app without signing
        run: xcodebuild -project i7Companion.xcodeproj -scheme i7Mac -configuration Release -derivedDataPath build/ci-mac CODE_SIGNING_ALLOWED=NO build
      - name: Build Now Playing helper
        run: clang -dynamiclib -fobjc-arc -arch arm64 -arch x86_64 -framework Foundation Helpers/NowPlaying/now-playing.m -o build/now-playing.dylib
      - name: Build iPhone app without signing
        run: xcodebuild -project i7Companion.xcodeproj -scheme i7Phone -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ci-phone CODE_SIGNING_ALLOWED=NO build
      - name: Run phone-independent checks
        run: ./scripts/check.sh
